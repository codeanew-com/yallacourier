# Verifies the deploy secrets without deploying anything:
# every secret is set, the SSH key and host key work, and DEPLOY_PATH is the app.
# Run it from the Actions tab (Check deploy secrets → Run workflow).

name: Check deploy secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-secrets.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: All secrets are set
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            if [ -n "${!name}" ]; then echo "set      $name"; else echo "MISSING  $name"; missing=1; fi
          done
          exit $missing

      - name: SSH login and deploy path
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          # tr strips Windows line endings (CRLF) that come from copying the key in Notepad.
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts

          # Shape of the key only — never its content.
          k=~/.ssh/deploy_key
          echo "key lines: $(wc -l < $k)"
          head -1 $k | grep -qx -- '-----BEGIN OPENSSH PRIVATE KEY-----' && echo "first line: BEGIN OPENSSH PRIVATE KEY (ok)" || echo "first line: NOT '-----BEGIN OPENSSH PRIVATE KEY-----'"
          grep -qx -- '-----END OPENSSH PRIVATE KEY-----' $k && echo "END line: present (ok)" || echo "END line: MISSING"
          grep -q '^ssh-ed25519 ' $k && echo "WARNING: this looks like the PUBLIC key (.pub), not the private key"
          if ssh-keygen -y -f $k > /dev/null 2>&1; then echo "private key: valid"; else echo "private key: INVALID"; exit 1; fi
          echo "known_hosts lines: $(grep -c . ~/.ssh/known_hosts)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -e
          echo "ssh login: ok"
          cd "$1"
          test -f artisan && echo "deploy path: Laravel app found"
          test -f .env && echo ".env: present"
          php -v | head -1
          rsync --version | head -1
          mysqldump --version
          EOF
